name: cc-005
description: >-
  Tier 5 (1B-3B params): adds MMLU and GSM8K subsets, ARC-Challenge, full HumanEval and MBPP, and
  agentic project building (hidden tests). Superseded lite tasks (tool_format, arithmetic,
  code_lite, knowledge_uz) are replaced by their full counterparts (tool_e2e, gsm8k, HumanEval / MBPP,
  Belebele).
param_range: [1B, 3B]
tasks:
  - {task: chat_format, limit: 50, threshold: 0.9}
  - {task: chat_sanity, limit: 20, threshold: 0.85, max_new_tokens: 32}
  - {task: identity, limit: 12, threshold: 0.8}
  - {task: perplexity, limit: 32768, threshold: 1.3, lower_is_better: true}
  - {task: tool_e2e, limit: 40, threshold: 0.5}
  - {task: belebele_uz, limit: 400, threshold: 0.35}
  - {task: arc_easy, limit: 500, threshold: 0.55}
  - {task: arc_challenge, limit: 400, threshold: 0.3}
  - {task: hellaswag, limit: 500, threshold: 0.45}
  - {task: mmlu, limit: 500, threshold: 0.3}
  - {task: gsm8k, limit: 200, threshold: 0.1}
  - {task: humaneval, limit: null, threshold: 0.1}
  - {task: mbpp, limit: null, threshold: 0.15}
  - {task: ifeval_lite, limit: 30, threshold: 0.3}
  - {task: detail_check, limit: 20, threshold: 0.55}
  - {task: plan_bench, limit: 20, threshold: 0.2}
  - {task: ifeval, limit: 200, threshold: 0.2}
  - {task: project_build, limit: 4, threshold: 0.1}
  - {task: speed, limit: 64, threshold: null}
