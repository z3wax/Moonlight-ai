name: cc-010
description: >-
  Tier 10 (1T params): the cc-009 task set with the strictest thresholds. Every task runs on its full dataset (limit null)
  except the bundled sets and the agentic / long-context tasks.
param_range: [1T, 1T]
tasks:
  - {task: chat_format, limit: 50, threshold: 0.99}
  - {task: chat_sanity, limit: 20, threshold: 0.97, max_new_tokens: 32}
  - {task: identity, limit: 12, threshold: 0.97}
  - {task: perplexity, limit: 65536, threshold: 0.85, lower_is_better: true}
  - {task: tool_e2e, limit: 50, threshold: 0.9}
  - {task: tool_e2e, name: agent_multi_tool, limit: 30, threshold: 0.85, multi: true, max_new_tokens: 256}
  - {task: belebele_uz, limit: null, threshold: 0.85}
  - {task: arc_easy, limit: null, threshold: 0.92}
  - {task: arc_challenge, limit: null, threshold: 0.8}
  - {task: hellaswag, limit: null, threshold: 0.87}
  - {task: mmlu, limit: null, threshold: 0.8}
  - {task: gsm8k, limit: null, threshold: 0.85, max_new_tokens: 512}
  - {task: humaneval, limit: null, threshold: 0.65, max_new_tokens: 512}
  - {task: mbpp, limit: null, threshold: 0.7, max_new_tokens: 512}
  - {task: needle, limit: 9, threshold: 0.98}
  - {task: vision_caption, limit: 8, threshold: 0.85}
  - {task: ifeval_lite, limit: 30, threshold: 0.85}
  - {task: detail_check, limit: 20, threshold: 0.95}
  - {task: plan_bench, limit: 20, threshold: 0.8, max_new_tokens: 512}
  - {task: ifeval, limit: null, threshold: 0.8, max_new_tokens: 768}
  - {task: project_build, limit: 4, threshold: 0.8, max_steps: 24, max_new_tokens: 1024}
  - {task: speed, limit: 128, threshold: null}
