name: cc-008
description: >-
  Tier 8 (100B-235B params): the cc-007 task set with stricter thresholds. Every task runs on its full
  dataset (limit null) except the bundled sets and the agentic / long-context tasks.
param_range: [100B, 235B]
tasks:
  - {task: chat_format, limit: 50, threshold: 0.97}
  - {task: chat_sanity, limit: 20, threshold: 0.95, max_new_tokens: 32}
  - {task: identity, limit: 12, threshold: 0.95}
  - {task: perplexity, limit: 65536, threshold: 0.95, lower_is_better: true}
  - {task: tool_e2e, limit: 50, threshold: 0.8}
  - {task: tool_e2e, name: agent_multi_tool, limit: 30, threshold: 0.65, multi: true, max_new_tokens: 256}
  - {task: belebele_uz, limit: null, threshold: 0.7}
  - {task: arc_easy, limit: null, threshold: 0.85}
  - {task: arc_challenge, limit: null, threshold: 0.62}
  - {task: hellaswag, limit: null, threshold: 0.8}
  - {task: mmlu, limit: null, threshold: 0.68}
  - {task: gsm8k, limit: null, threshold: 0.65, max_new_tokens: 512}
  - {task: humaneval, limit: null, threshold: 0.45, max_new_tokens: 512}
  - {task: mbpp, limit: null, threshold: 0.55, max_new_tokens: 512}
  - {task: needle, limit: 9, threshold: 0.9}
  - {task: vision_caption, limit: 8, threshold: 0.7}
  - {task: ifeval_lite, limit: 30, threshold: 0.65}
  - {task: detail_check, limit: 20, threshold: 0.85}
  - {task: plan_bench, limit: 20, threshold: 0.6, max_new_tokens: 512}
  - {task: ifeval, limit: null, threshold: 0.6, max_new_tokens: 768}
  - {task: project_build, limit: 4, threshold: 0.6, max_steps: 24, max_new_tokens: 1024}
  - {task: speed, limit: 128, threshold: null}
