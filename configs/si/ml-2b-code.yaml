# ml-2b-code: Moonlight 2B hybrid attention+retention code model (40% code pretraining + code-heavy SFT; still a chat model). Reference recipe for a large cluster. [generated by scripts/generate_configs.py - do not edit]
# Hardware: 8x A100 80 GB (FSDP); budget 100B LM training tokens; benchmark cc-005.
# Train: moonlight train ml-2b-code  |  python: ml.train("ml-2b-code")
name: ml-2b-code
description: Moonlight 2B hybrid attention+retention code model (40% code pretraining + code-heavy SFT; still a chat model). Reference recipe for a large cluster.
tier: si
kind: code
benchmark: cc-005
nominal_params: 2B

model:
  vocab_size: 65536
  d_model: 2304
  n_layers: 24
  n_heads: 36
  head_dim: 64
  retention_ratio: 0.375
  n_kv_heads: 2
  attn_window: 4096
  global_every: 4
  ffn_hidden: 8064
  token_shift: 4
  value_residual: true
  qk_norm: true
  output_gate: true
  rope_theta: 500000.0
  max_seq_len: 4096
  tie_embeddings: true
  softcap: 30.0
  mtp_depth: 1
  mtp_block: false
  mtp_weight: 0.3
  z_loss: 0.0001
  init_std: 0.02
  moe:
    enabled: false
    n_experts: 0
    top_k: 0
    n_shared: 0
    expert_hidden: 0
    first_dense_layers: 0
    aux_loss_weight: 0.001
    bias_update_rate: 0.001
    capacity_factor: 0.0
  activation_checkpointing: false

multimodal:
  enabled: false
  vision_encoder: google/siglip-base-patch16-224
  vision_dim: 768
  n_image_tokens: 196
  freeze_encoder: true

tokenizer:
  vocab_size: 65536
  path: null
  train_chars: 100000000
  split_digits: true

data:
  cache_dir: ~/.cache/moonlight
  offline: false
  languages: [uz, en]
  pretrain:
    - {source: uz-news, weight: 0.15, max_chars: 6.0e+10}
    - {source: uz-wiki, weight: 0.06, max_chars: 2.4e+10}
    - {source: uz-telegram, weight: 0.04, max_chars: 1.6e+10}
    - {source: uz-books, weight: 0.07, max_chars: 2.8e+10}
    - {source: fineweb-edu, weight: 0.18, max_chars: 7.2e+10}
    - {source: cosmopedia, weight: 0.1, max_chars: 4.0e+10}
    - {source: stack-python, weight: 0.25, max_chars: 1.0e+11}
    - {source: codeparrot, weight: 0.15, max_chars: 6.0e+10}
  sft:
    - {source: slimorca-uz, max_examples: 90000}
    - {source: oasst2-uz, max_examples: 15000}
    - {source: alpaca-uz, max_examples: 60000}
    - {source: uzbek-instruct, max_examples: 30000}
    - {source: sft-uz-9k, max_examples: 9000}
    - {source: smoltalk, max_examples: 90000}
    - {source: smoltalk-everyday, max_examples: 2300}
    - {source: smoltalk-constraints, max_examples: 34000}
    - {source: smoltalk-code, max_examples: 150000}
    - {source: python-18k, max_examples: 19000}
    - {source: codefeedback, max_examples: 150000}
    - {source: smoltalk-tools, max_examples: 60000}
    - {source: glaive-tools, max_examples: 45000}
    - {source: openthoughts, max_examples: 60000}
    - {source: smoltalk-magpie, max_examples: 120000}
  synthetic:
    identity: true
    knowledge: true
    arithmetic: 8000
    tool_calls: 4000
    code: 7200
    plan: 400
    constraints: 1200
    detail: 800
    projects: 160
  vision: []

train:
  phases:
    - {name: pretrain, tokens: 1.0e+11, lr_scale: 1.0, sft_mix: 0.0, anneal_sft_mix: 0.25}
    - {name: sft, epochs: 2.0, lr_scale: 0.25, replay: 0.1}
    - name: dpo
      sources:
        - {source: ultrafeedback, max_examples: 60000}
      synthetic_pairs: 5000
      beta: 0.1
      loss: dpo
      epochs: 1.0
      lr_scale: 0.1
    - {name: grpo, tasks: [code_lite, constraints], group_size: 8, prompts_per_step: 16, max_new_tokens: 256, temperature: 1.0, kl_coef: 0.02, clip: 0.2, steps: 300, lr_scale: 0.05}
  seq_len: 4096
  batch_size: 4
  batch_tokens: 2097152
  optimizer:
    name: muon
    lr: 0.01
    momentum: 0.95
    adam_lr: 0.001
    embed_lr: 0.001
    betas: [0.9, 0.95]
    weight_decay: 0.1
    grad_clip: 1.0
  schedule:
    name: wsd
    warmup_steps: 2000
    decay_frac: 0.2
    min_lr_ratio: 0.01
  precision: bf16
  compile: true
  ema: 0.0
  curriculum:
    enabled: true
    start_seq_len: 1024
    until_frac: 0.1
  eval_every: 2000
  eval_batches: 100
  log_every: 10
  checkpoint_every_min: 60.0
  output_dir: runs/ml-2b-code
  seed: 1337
  hardware: a100-8
  distributed:
    strategy: fsdp
    fsdp_shard: full
    tp_size: 1
    ep_size: 1

chat:
  name: Moonlight
  system_prompt: Sen Moonlight — o'zbek va ingliz tillarida samimiy, aniq va foydali javob beradigan, kod yoza oladigan va kerak bo'lganda vositalardan (tools) foydalanadigan sun'iy intellekt yordamchisisan.
  best_of: 1
  temperature: 0.2
  top_k: 40
  top_p: 0.95
  repetition_penalty: 1.05
  no_repeat_ngram: 0
  max_new_tokens: 1024
  tools: true
