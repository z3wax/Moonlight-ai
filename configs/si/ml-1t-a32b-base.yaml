# ml-1t-a32b-base: Moonlight 1T (32B active) MoE hybrid attention+retention base model (pretraining only; a small SFT anneal mix keeps the chat format usable). Reference recipe for a large cluster. [generated by scripts/generate_configs.py - do not edit]
# Hardware: 2048x H100 (FSDP; tp_size 8 / ep_size 64 are documented placeholders); budget 20T LM training tokens; benchmark cc-010.
# Train: moonlight train ml-1t-a32b-base  |  python: ml.train("ml-1t-a32b-base")
name: ml-1t-a32b-base
description: Moonlight 1T (32B active) MoE hybrid attention+retention base model (pretraining only; a small SFT anneal mix keeps the chat format usable). Reference recipe for a large cluster.
tier: si
kind: base
benchmark: cc-010
nominal_params: 1T

model:
  vocab_size: 131072
  d_model: 7168
  n_layers: 57
  n_heads: 64
  head_dim: 128
  retention_ratio: 0.25
  n_kv_heads: 8
  attn_window: 4096
  global_every: 4
  ffn_hidden: 18432
  token_shift: 4
  value_residual: true
  qk_norm: true
  output_gate: true
  rope_theta: 500000.0
  max_seq_len: 8192
  tie_embeddings: true
  softcap: 30.0
  mtp_depth: 1
  mtp_block: false
  mtp_weight: 0.3
  z_loss: 0.0001
  init_std: 0.0059
  moe:
    enabled: true
    n_experts: 384
    top_k: 8
    n_shared: 1
    expert_hidden: 2048
    first_dense_layers: 1
    aux_loss_weight: 0.001
    bias_update_rate: 0.001
    capacity_factor: 0.0
  activation_checkpointing: true

multimodal:
  enabled: false
  vision_encoder: google/siglip-base-patch16-224
  vision_dim: 768
  n_image_tokens: 196
  freeze_encoder: true

tokenizer:
  vocab_size: 131072
  path: null
  train_chars: 200000000
  split_digits: true

data:
  cache_dir: ~/.cache/moonlight
  offline: false
  languages: [uz, en]
  pretrain:
    - {source: uz-news, weight: 0.2, max_chars: 1.6e+13}
    - {source: uz-wiki, weight: 0.08, max_chars: 6.4e+12}
    - {source: uz-telegram, weight: 0.07, max_chars: 5.6e+12}
    - {source: uz-books, weight: 0.1, max_chars: 8.0e+12}
    - {source: fineweb-edu, weight: 0.25, max_chars: 2.0e+13}
    - {source: cosmopedia, weight: 0.15, max_chars: 1.2e+13}
    - {source: stack-python, weight: 0.1, max_chars: 8.0e+12}
    - {source: codeparrot, weight: 0.05, max_chars: 4.0e+12}
  sft:
    - {source: slimorca-uz, max_examples: 36000}
    - {source: sft-uz-9k, max_examples: 5400}
    - {source: smoltalk-everyday, max_examples: 1400}
    - {source: python-18k, max_examples: 11000}
  synthetic:
    identity: true
    knowledge: true
    arithmetic: 500
    tool_calls: 200
    code: 200
  vision: []

train:
  phases:
    - {name: pretrain, tokens: 1.8e+13, lr_scale: 1.0, sft_mix: 0.0, anneal_sft_mix: 0.1}
    - {name: anneal, tokens: 2.0e+12, lr_scale: 1.0, anneal_sft_mix: 0.1}
  seq_len: 4096
  batch_size: 1
  batch_tokens: 8388608
  optimizer:
    name: muon
    lr: 0.004
    momentum: 0.95
    adam_lr: 0.0004
    embed_lr: 0.0004
    betas: [0.9, 0.95]
    weight_decay: 0.1
    grad_clip: 1.0
  schedule:
    name: wsd
    warmup_steps: 2000
    decay_frac: 0.2
    min_lr_ratio: 0.01
  precision: bf16
  compile: true
  ema: 0.0
  curriculum:
    enabled: true
    start_seq_len: 1024
    until_frac: 0.1
  eval_every: 2000
  eval_batches: 100
  log_every: 10
  checkpoint_every_min: 60.0
  output_dir: runs/ml-1t-a32b-base
  seed: 1337
  hardware: h100-2048
  distributed:
    strategy: fsdp
    fsdp_shard: full
    tp_size: 8
    ep_size: 64

chat:
  name: Moonlight
  system_prompt: Sen Moonlight — o'zbek va ingliz tillarida samimiy, aniq va foydali javob beradigan, kod yoza oladigan va kerak bo'lganda vositalardan (tools) foydalanadigan sun'iy intellekt yordamchisisan.
  best_of: 1
  temperature: 0.7
  top_k: 40
  top_p: 0.9
  repetition_penalty: 1.05
  no_repeat_ngram: 0
  max_new_tokens: 1024
  tools: true
