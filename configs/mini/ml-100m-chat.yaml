# ml-100m-chat: Moonlight 100M hybrid attention+retention chat model (Uzbek + English conversation, coding and tool calling). [generated by scripts/generate_configs.py - do not edit]
# Hardware: Kaggle 2x T4 (torchrun --nproc_per_node 2, DDP); budget 2B LM training tokens; benchmark cc-003.
# Train: moonlight train ml-100m-chat  |  python: ml.train("ml-100m-chat")
name: ml-100m-chat
description: Moonlight 100M hybrid attention+retention chat model (Uzbek + English conversation, coding and tool calling).
tier: mini
kind: chat
benchmark: cc-003
nominal_params: 100M

model:
  vocab_size: 32768
  d_model: 768
  n_layers: 12
  n_heads: 12
  head_dim: 64
  retention_ratio: 0.5
  n_kv_heads: 2
  attn_window: null
  global_every: 1
  ffn_hidden: 1536
  token_shift: 4
  value_residual: true
  qk_norm: true
  output_gate: true
  rope_theta: 10000.0
  max_seq_len: 2048
  tie_embeddings: true
  softcap: 30.0
  mtp_depth: 1
  mtp_block: false
  mtp_weight: 0.3
  z_loss: 0.0
  init_std: 0.02
  moe:
    enabled: false
    n_experts: 0
    top_k: 0
    n_shared: 0
    expert_hidden: 0
    first_dense_layers: 0
    aux_loss_weight: 0.001
    bias_update_rate: 0.001
    capacity_factor: 0.0
  activation_checkpointing: false

multimodal:
  enabled: false
  vision_encoder: google/siglip-base-patch16-224
  vision_dim: 768
  n_image_tokens: 49
  freeze_encoder: true

tokenizer:
  vocab_size: 32768
  path: null
  train_chars: 50000000
  split_digits: true

data:
  cache_dir: ~/.cache/moonlight
  offline: false
  languages: [uz, en]
  pretrain:
    - {source: uz-news, weight: 0.2, max_chars: 1.6e+9}
    - {source: uz-wiki, weight: 0.08, max_chars: 6.4e+8}
    - {source: uz-telegram, weight: 0.07, max_chars: 5.6e+8}
    - {source: uz-books, weight: 0.1, max_chars: 8.0e+8}
    - {source: fineweb-edu, weight: 0.25, max_chars: 2.0e+9}
    - {source: cosmopedia, weight: 0.15, max_chars: 1.2e+9}
    - {source: stack-python, weight: 0.1, max_chars: 8.0e+8}
    - {source: codeparrot, weight: 0.05, max_chars: 4.0e+8}
  sft:
    - {source: slimorca-uz, max_examples: 60000}
    - {source: oasst2-uz, max_examples: 10000}
    - {source: alpaca-uz, max_examples: 40000}
    - {source: uzbek-instruct, max_examples: 20000}
    - {source: sft-uz-9k, max_examples: 9000}
    - {source: smoltalk, max_examples: 60000}
    - {source: smoltalk-everyday, max_examples: 2300}
    - {source: smoltalk-constraints, max_examples: 20000}
    - {source: smoltalk-code, max_examples: 20000}
    - {source: python-18k, max_examples: 18000}
    - {source: codefeedback, max_examples: 20000}
    - {source: smoltalk-tools, max_examples: 20000}
    - {source: glaive-tools, max_examples: 15000}
  synthetic:
    identity: true
    knowledge: true
    arithmetic: 4000
    tool_calls: 2000
    code: 1200
    plan: 200
    constraints: 600
    detail: 400
    projects: 40
  vision: []

train:
  phases:
    - {name: pretrain, tokens: 2.0e+9, lr_scale: 1.0, sft_mix: 0.0, anneal_sft_mix: 0.25}
    - {name: sft, epochs: 2.0, lr_scale: 0.5, replay: 0.1}
  seq_len: 1024
  batch_size: 16
  batch_tokens: 524288
  optimizer:
    name: muon
    lr: 0.015
    momentum: 0.95
    adam_lr: 0.002
    embed_lr: 0.002
    betas: [0.9, 0.95]
    weight_decay: 0.0
    grad_clip: 1.0
  schedule:
    name: wsd
    warmup_steps: 500
    decay_frac: 0.25
    min_lr_ratio: 0.02
  precision: auto
  compile: true
  ema: 0.999
  curriculum:
    enabled: true
    start_seq_len: 256
    until_frac: 0.2
  eval_every: 1000
  eval_batches: 50
  log_every: 100
  checkpoint_every_min: 30.0
  output_dir: runs/ml-100m-chat
  seed: 1337
  hardware: kaggle-2xt4
  distributed:
    strategy: ddp
    fsdp_shard: full
    tp_size: 1
    ep_size: 1

chat:
  name: Moonlight
  system_prompt: Sen Moonlight — o'zbek va ingliz tillarida samimiy, aniq va foydali javob beradigan, kod yoza oladigan va kerak bo'lganda vositalardan (tools) foydalanadigan sun'iy intellekt yordamchisisan.
  best_of: 3
  temperature: 0.7
  top_k: 40
  top_p: 0.9
  repetition_penalty: 1.1
  no_repeat_ngram: 0
  max_new_tokens: 256
  tools: true
