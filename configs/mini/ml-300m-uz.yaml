# ml-300m-uz: Moonlight 300M hybrid attention+retention Uzbek-only chat model (Uzbek pretraining + Uzbek SFT). [generated by scripts/generate_configs.py - do not edit]
# Hardware: 1x A100 80 GB (DDP-ready: torchrun --nproc_per_node N); budget 9B LM training tokens; benchmark cc-004.
# Train: moonlight train ml-300m-uz  |  python: ml.train("ml-300m-uz")
name: ml-300m-uz
description: Moonlight 300M hybrid attention+retention Uzbek-only chat model (Uzbek pretraining + Uzbek SFT).
tier: mini
kind: chat
benchmark: cc-004
nominal_params: 300M

model:
  vocab_size: 32768
  d_model: 1024
  n_layers: 22
  n_heads: 16
  head_dim: 64
  retention_ratio: 0.5
  n_kv_heads: 4
  attn_window: null
  global_every: 1
  ffn_hidden: 2368
  token_shift: 4
  value_residual: true
  qk_norm: true
  output_gate: true
  rope_theta: 10000.0
  max_seq_len: 2048
  tie_embeddings: true
  softcap: 30.0
  mtp_depth: 1
  mtp_block: false
  mtp_weight: 0.3
  z_loss: 0.0
  init_std: 0.02
  moe:
    enabled: false
    n_experts: 0
    top_k: 0
    n_shared: 0
    expert_hidden: 0
    first_dense_layers: 0
    aux_loss_weight: 0.001
    bias_update_rate: 0.001
    capacity_factor: 0.0
  activation_checkpointing: false

multimodal:
  enabled: false
  vision_encoder: google/siglip-base-patch16-224
  vision_dim: 768
  n_image_tokens: 49
  freeze_encoder: true

tokenizer:
  vocab_size: 32768
  path: null
  train_chars: 50000000
  split_digits: true

data:
  cache_dir: ~/.cache/moonlight
  offline: false
  languages: [uz]
  pretrain:
    - {source: uz-news, weight: 0.4, max_chars: 1.4e+10}
    - {source: uz-wiki, weight: 0.15, max_chars: 5.4e+9}
    - {source: uz-telegram, weight: 0.15, max_chars: 5.4e+9}
    - {source: uz-books, weight: 0.3, max_chars: 1.1e+10}
  sft:
    - {source: slimorca-uz, max_examples: 90000}
    - {source: oasst2-uz, max_examples: 15000}
    - {source: alpaca-uz, max_examples: 60000}
    - {source: uzbek-instruct, max_examples: 30000}
    - {source: sft-uz-9k, max_examples: 9000}
  synthetic:
    identity: true
    knowledge: true
    arithmetic: 4000
    tool_calls: 2000
    code: 1200
    plan: 200
    constraints: 600
    detail: 400
    projects: 40
  vision: []

train:
  phases:
    - {name: pretrain, tokens: 9.0e+9, lr_scale: 1.0, sft_mix: 0.0, anneal_sft_mix: 0.25}
    - {name: sft, epochs: 2.0, lr_scale: 0.5, replay: 0.1}
  seq_len: 1024
  batch_size: 8
  batch_tokens: 524288
  optimizer:
    name: muon
    lr: 0.015
    momentum: 0.95
    adam_lr: 0.002
    embed_lr: 0.002
    betas: [0.9, 0.95]
    weight_decay: 0.0
    grad_clip: 1.0
  schedule:
    name: wsd
    warmup_steps: 500
    decay_frac: 0.25
    min_lr_ratio: 0.02
  precision: auto
  compile: true
  ema: 0.999
  curriculum:
    enabled: true
    start_seq_len: 256
    until_frac: 0.2
  eval_every: 1000
  eval_batches: 50
  log_every: 100
  checkpoint_every_min: 30.0
  output_dir: runs/ml-300m-uz
  seed: 1337
  hardware: a100-1
  distributed:
    strategy: ddp
    fsdp_shard: full
    tp_size: 1
    ep_size: 1

chat:
  name: Moonlight
  system_prompt: Sen Moonlight — o'zbek va ingliz tillarida samimiy, aniq va foydali javob beradigan, kod yoza oladigan va kerak bo'lganda vositalardan (tools) foydalanadigan sun'iy intellekt yordamchisisan.
  best_of: 3
  temperature: 0.7
  top_k: 40
  top_p: 0.9
  repetition_penalty: 1.1
  no_repeat_ngram: 0
  max_new_tokens: 256
  tools: true
