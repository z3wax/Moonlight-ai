# ml-1m-debug: Moonlight 1M hybrid attention+retention debug recipe (CPU, offline bundled data, tiny step budgets; used by the test-suite). [generated by scripts/generate_configs.py - do not edit]
# Hardware: CPU only (offline, a few minutes); budget 60 optimizer steps; benchmark cc-001.
# Train: moonlight train ml-1m-debug  |  python: ml.train("ml-1m-debug")
name: ml-1m-debug
description: Moonlight 1M hybrid attention+retention debug recipe (CPU, offline bundled data, tiny step budgets; used by the test-suite).
tier: test
kind: debug
benchmark: cc-001
nominal_params: 1M

model:
  vocab_size: 2048
  d_model: 96
  n_layers: 6
  n_heads: 4
  head_dim: 24
  retention_ratio: 0.5
  n_kv_heads: 1
  attn_window: null
  global_every: 1
  ffn_hidden: 320
  token_shift: 4
  value_residual: true
  qk_norm: true
  output_gate: true
  rope_theta: 10000.0
  max_seq_len: 256
  tie_embeddings: true
  softcap: 30.0
  mtp_depth: 1
  mtp_block: false
  mtp_weight: 0.3
  z_loss: 0.0
  init_std: 0.02
  moe:
    enabled: false
    n_experts: 0
    top_k: 0
    n_shared: 0
    expert_hidden: 0
    first_dense_layers: 0
    aux_loss_weight: 0.001
    bias_update_rate: 0.001
    capacity_factor: 0.0
  activation_checkpointing: false

multimodal:
  enabled: false
  vision_encoder: google/siglip-base-patch16-224
  vision_dim: 768
  n_image_tokens: 49
  freeze_encoder: true

tokenizer:
  vocab_size: 2048
  path: null
  train_chars: 2000000
  split_digits: true

data:
  cache_dir: ~/.cache/moonlight
  offline: true
  languages: [uz, en]
  pretrain:
    - {source: uz-news, weight: 0.2, max_chars: 800000.0}
    - {source: uz-wiki, weight: 0.08, max_chars: 320000.0}
    - {source: uz-telegram, weight: 0.07, max_chars: 280000.0}
    - {source: uz-books, weight: 0.1, max_chars: 400000.0}
    - {source: fineweb-edu, weight: 0.25, max_chars: 1.0e+6}
    - {source: cosmopedia, weight: 0.15, max_chars: 600000.0}
    - {source: stack-python, weight: 0.1, max_chars: 400000.0}
    - {source: codeparrot, weight: 0.05, max_chars: 200000.0}
  sft:
    - {source: slimorca-uz, max_examples: 600}
    - {source: alpaca-uz, max_examples: 400}
    - {source: smoltalk-everyday, max_examples: 50}
    - {source: python-18k, max_examples: 180}
    - {source: smoltalk-tools, max_examples: 200}
  synthetic:
    identity: 40
    greetings: 40
    knowledge: 60
    arithmetic: 100
    tool_calls: 60
    code: 40
    think: 20
    plan: 10
    constraints: 20
    detail: 20
    projects: 4
  vision: []

train:
  phases:
    - {name: pretrain, steps: 40, lr_scale: 1.0, sft_mix: 0.0, anneal_sft_mix: 0.25}
    - {name: sft, steps: 20, epochs: 1.0, lr_scale: 0.5, replay: 0.1}
  seq_len: 128
  batch_size: 8
  batch_tokens: 1024
  optimizer:
    name: muon
    lr: 0.02
    momentum: 0.95
    adam_lr: 0.003
    embed_lr: 0.003
    betas: [0.9, 0.95]
    weight_decay: 0.0
    grad_clip: 1.0
  schedule:
    name: wsd
    warmup_steps: 5
    decay_frac: 0.35
    min_lr_ratio: 0.02
  precision: fp32
  compile: false
  ema: 0.0
  curriculum:
    enabled: false
    start_seq_len: 64
    until_frac: 0.3
  eval_every: 20
  eval_batches: 2
  log_every: 5
  checkpoint_every_min: 1.0
  output_dir: runs/ml-1m-debug
  seed: 1337
  hardware: cpu
  distributed:
    strategy: none
    fsdp_shard: full
    tp_size: 1
    ep_size: 1

chat:
  name: Moonlight
  system_prompt: Sen Moonlight — o'zbek va ingliz tillarida samimiy, aniq va foydali javob beradigan, kod yoza oladigan va kerak bo'lganda vositalardan (tools) foydalanadigan sun'iy intellekt yordamchisisan.
  best_of: 3
  temperature: 0.7
  top_k: 40
  top_p: 0.9
  repetition_penalty: 1.1
  no_repeat_ngram: 3
  max_new_tokens: 256
  tools: true
