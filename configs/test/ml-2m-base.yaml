# ml-2m-base: Moonlight 2M hybrid attention+retention base model (pretraining only; a small SFT anneal mix keeps the chat format usable). [generated by scripts/generate_configs.py - do not edit]
# Hardware: Colab T4 16 GB (single GPU); budget ~15 min; benchmark cc-001.
# Train: moonlight train ml-2m-base  |  python: ml.train("ml-2m-base")
name: ml-2m-base
description: Moonlight 2M hybrid attention+retention base model (pretraining only; a small SFT anneal mix keeps the chat format usable).
tier: test
kind: base
benchmark: cc-001
nominal_params: 2M

model:
  vocab_size: 2048
  d_model: 128
  n_layers: 6
  n_heads: 4
  head_dim: 32
  retention_ratio: 0.5
  n_kv_heads: 1
  attn_window: null
  global_every: 1
  ffn_hidden: 576
  token_shift: 4
  value_residual: true
  qk_norm: true
  output_gate: true
  rope_theta: 10000.0
  max_seq_len: 256
  tie_embeddings: true
  softcap: 30.0
  mtp_depth: 1
  mtp_block: false
  mtp_weight: 0.3
  z_loss: 0.0
  init_std: 0.02
  moe:
    enabled: false
    n_experts: 0
    top_k: 0
    n_shared: 0
    expert_hidden: 0
    first_dense_layers: 0
    aux_loss_weight: 0.001
    bias_update_rate: 0.001
    capacity_factor: 0.0
  activation_checkpointing: false

multimodal:
  enabled: false
  vision_encoder: google/siglip-base-patch16-224
  vision_dim: 768
  n_image_tokens: 49
  freeze_encoder: true

tokenizer:
  vocab_size: 2048
  path: null
  train_chars: 10000000
  split_digits: true

data:
  cache_dir: ~/.cache/moonlight
  offline: false
  languages: [uz, en]
  pretrain:
    - {source: uz-news, weight: 0.2, max_chars: 1.2e+7}
    - {source: uz-wiki, weight: 0.08, max_chars: 4.8e+6}
    - {source: uz-telegram, weight: 0.07, max_chars: 4.2e+6}
    - {source: uz-books, weight: 0.1, max_chars: 6.0e+6}
    - {source: fineweb-edu, weight: 0.25, max_chars: 1.5e+7}
    - {source: cosmopedia, weight: 0.15, max_chars: 9.0e+6}
    - {source: stack-python, weight: 0.1, max_chars: 6.0e+6}
    - {source: codeparrot, weight: 0.05, max_chars: 3.0e+6}
  sft:
    - {source: slimorca-uz, max_examples: 600}
    - {source: sft-uz-9k, max_examples: 90}
    - {source: smoltalk-everyday, max_examples: 50}
    - {source: python-18k, max_examples: 180}
  synthetic:
    identity: true
    knowledge: true
    arithmetic: 500
    tool_calls: 200
    code: 200
  vision: []

train:
  phases:
    - {name: pretrain, minutes: 15, lr_scale: 1.0, sft_mix: 0.0, anneal_sft_mix: 0.1}
  seq_len: 256
  batch_size: 64
  batch_tokens: 16384
  optimizer:
    name: muon
    lr: 0.02
    momentum: 0.95
    adam_lr: 0.003
    embed_lr: 0.003
    betas: [0.9, 0.95]
    weight_decay: 0.0
    grad_clip: 1.0
  schedule:
    name: wsd
    warmup_steps: 50
    decay_frac: 0.35
    min_lr_ratio: 0.02
  precision: auto
  compile: true
  ema: 0.998
  curriculum:
    enabled: true
    start_seq_len: 128
    until_frac: 0.3
  eval_every: 250
  eval_batches: 20
  log_every: 50
  checkpoint_every_min: 10.0
  output_dir: runs/ml-2m-base
  seed: 1337
  hardware: colab-t4
  distributed:
    strategy: none
    fsdp_shard: full
    tp_size: 1
    ep_size: 1

chat:
  name: Moonlight
  system_prompt: Sen Moonlight — o'zbek va ingliz tillarida samimiy, aniq va foydali javob beradigan, kod yoza oladigan va kerak bo'lganda vositalardan (tools) foydalanadigan sun'iy intellekt yordamchisisan.
  best_of: 3
  temperature: 0.7
  top_k: 40
  top_p: 0.9
  repetition_penalty: 1.1
  no_repeat_ngram: 3
  max_new_tokens: 256
  tools: true
