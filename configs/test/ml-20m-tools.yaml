# ml-20m-tools: Moonlight 20M hybrid attention+retention tool-calling model (tool-call-heavy SFT: glaive + apigen + synthetic tool loops). [generated by scripts/generate_configs.py - do not edit]
# Hardware: Colab T4 16 GB (single GPU); budget ~75 min; benchmark cc-002.
# Train: moonlight train ml-20m-tools  |  python: ml.train("ml-20m-tools")
name: ml-20m-tools
description: 'Moonlight 20M hybrid attention+retention tool-calling model (tool-call-heavy SFT: glaive + apigen + synthetic tool loops).'
tier: test
kind: tools
benchmark: cc-002
nominal_params: 20M

model:
  vocab_size: 8192
  d_model: 384
  n_layers: 10
  n_heads: 6
  head_dim: 64
  retention_ratio: 0.5
  n_kv_heads: 1
  attn_window: null
  global_every: 1
  ffn_hidden: 896
  token_shift: 4
  value_residual: true
  qk_norm: true
  output_gate: true
  rope_theta: 10000.0
  max_seq_len: 1024
  tie_embeddings: true
  softcap: 30.0
  mtp_depth: 1
  mtp_block: false
  mtp_weight: 0.3
  z_loss: 0.0
  init_std: 0.02
  moe:
    enabled: false
    n_experts: 0
    top_k: 0
    n_shared: 0
    expert_hidden: 0
    first_dense_layers: 0
    aux_loss_weight: 0.001
    bias_update_rate: 0.001
    capacity_factor: 0.0
  activation_checkpointing: false

multimodal:
  enabled: false
  vision_encoder: google/siglip-base-patch16-224
  vision_dim: 768
  n_image_tokens: 49
  freeze_encoder: true

tokenizer:
  vocab_size: 8192
  path: null
  train_chars: 20000000
  split_digits: true

data:
  cache_dir: ~/.cache/moonlight
  offline: false
  languages: [uz, en]
  pretrain:
    - {source: uz-news, weight: 0.2, max_chars: 5.0e+7}
    - {source: uz-wiki, weight: 0.08, max_chars: 2.0e+7}
    - {source: uz-telegram, weight: 0.07, max_chars: 1.8e+7}
    - {source: uz-books, weight: 0.1, max_chars: 2.5e+7}
    - {source: fineweb-edu, weight: 0.25, max_chars: 6.2e+7}
    - {source: cosmopedia, weight: 0.15, max_chars: 3.8e+7}
    - {source: stack-python, weight: 0.1, max_chars: 2.5e+7}
    - {source: codeparrot, weight: 0.05, max_chars: 1.2e+7}
  sft:
    - {source: slimorca-uz, max_examples: 15000}
    - {source: oasst2-uz, max_examples: 2500}
    - {source: alpaca-uz, max_examples: 10000}
    - {source: uzbek-instruct, max_examples: 5000}
    - {source: sft-uz-9k, max_examples: 2200}
    - {source: smoltalk, max_examples: 15000}
    - {source: smoltalk-everyday, max_examples: 560}
    - {source: smoltalk-constraints, max_examples: 7500}
    - {source: smoltalk-code, max_examples: 5000}
    - {source: python-18k, max_examples: 4500}
    - {source: codefeedback, max_examples: 5000}
    - {source: smoltalk-tools, max_examples: 15000}
    - {source: glaive-tools, max_examples: 11000}
  synthetic:
    identity: true
    knowledge: true
    arithmetic: 2000
    tool_calls: 3000
    code: 600
    plan: 200
    constraints: 450
    detail: 400
    projects: 60
  vision: []

train:
  phases:
    - {name: pretrain, minutes: 55, lr_scale: 1.0, sft_mix: 0.0, anneal_sft_mix: 0.25}
    - {name: sft, minutes: 20, epochs: 2.0, lr_scale: 0.5, replay: 0.1}
  seq_len: 512
  batch_size: 32
  batch_tokens: 16384
  optimizer:
    name: muon
    lr: 0.02
    momentum: 0.95
    adam_lr: 0.003
    embed_lr: 0.003
    betas: [0.9, 0.95]
    weight_decay: 0.0
    grad_clip: 1.0
  schedule:
    name: wsd
    warmup_steps: 100
    decay_frac: 0.35
    min_lr_ratio: 0.02
  precision: auto
  compile: true
  ema: 0.998
  curriculum:
    enabled: true
    start_seq_len: 128
    until_frac: 0.3
  eval_every: 250
  eval_batches: 20
  log_every: 50
  checkpoint_every_min: 10.0
  output_dir: runs/ml-20m-tools
  seed: 1337
  hardware: colab-t4
  distributed:
    strategy: none
    fsdp_shard: full
    tp_size: 1
    ep_size: 1

chat:
  name: Moonlight
  system_prompt: Sen Moonlight — o'zbek va ingliz tillarida samimiy, aniq va foydali javob beradigan, kod yoza oladigan va kerak bo'lganda vositalardan (tools) foydalanadigan sun'iy intellekt yordamchisisan.
  best_of: 3
  temperature: 0.7
  top_k: 40
  top_p: 0.9
  repetition_penalty: 1.05
  no_repeat_ngram: 0
  max_new_tokens: 256
  tools: true
