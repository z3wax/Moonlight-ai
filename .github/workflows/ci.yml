name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  MOONLIGHT_OFFLINE: "1"
  HF_HUB_OFFLINE: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }}, torch cpu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PyTorch (CPU wheel)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install moonlight + dev extras
        run: python -m pip install -e ".[dev]"

      - name: Byte-compile
        run: python -m compileall -q moonlight scripts tests

      - name: Pytest
        run: python -m pytest -q -x --timeout=900 --durations=15

  configs:
    name: configs + torch-free checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Deliberately WITHOUT torch: proves the SPEC import hygiene (config, params, registry, tokenizer,
      # data.*, tools, benchmarks.suites import without torch) and runs every torch-free test.
      - name: Install (no torch)
        run: |
          python -m pip install --no-deps -e .
          python -m pip install numpy "pyyaml>=6" "tokenizers>=0.15" "pyarrow>=12" pytest pytest-timeout

      - name: Configs are up to date
        run: python scripts/generate_configs.py --check

      - name: Torch-free test subset
        run: python -m pytest -q --timeout=600
